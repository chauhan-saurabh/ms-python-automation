# .github/workflows/test.yml

name: M&S E2E Tests

on:
  schedule:
    # Runs every hour at :00
    - cron: "0 * * * *"

  # Lets you trigger it manually from GitHub UI
  workflow_dispatch:

permissions:
  contents: write # needed to push report to gh-pages branch

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:

      # ── 1. Checkout master branch ─────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master

      # ── 2. Set up Python ──────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # ── 3. Install dependencies ───────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 4. Install Playwright browsers ────────────────────────
      - name: Install Playwright browsers
        run: python -m playwright install chromium --with-deps

      # ── 5. Create reports folder (in case tests crash early) ──
      - name: Create reports directory
        run: mkdir -p reports/screenshots

      # ── 6. Run tests ──────────────────────────────────────────
      - name: Run pytest
        env:
          MS_MOBILE: ${{ secrets.MS_MOBILE }}
          MS_PASSWORD: ${{ secrets.MS_PASSWORD }}
        run: pytest
        continue-on-error: true # always proceed to publish even if tests fail

      # ── 7. Stamp report + create index redirect ───────────────
      - name: Stamp report with run info
        run: |
          RUN_URL="https://github.com/chauhan-saurabh/ms-python-automation/actions/runs/${{ github.run_id }}"
          TIMESTAMP=$(date -u "+%d %b %Y %H:%M UTC")

          if [ -f reports/report.html ]; then
            sed -i "s|</body>|<div style='font-family:sans-serif;font-size:0.8rem;color:#888;padding:16px;text-align:center'>Run at ${TIMESTAMP} · <a href='${RUN_URL}'>GitHub Actions log</a></div></body>|" reports/report.html
          else
            echo "<html><body><h2>No report generated — check the Actions log.</h2><p><a href='${RUN_URL}'>View run</a></p></body></html>" > reports/report.html
          fi

          # Root index.html redirects straight to the report
          cat > reports/index.html << 'HTML'
          <!DOCTYPE html>
          <html>
            <head>
              <meta http-equiv="refresh" content="0; url=report.html" />
              <title>M&S Automation Report</title>
            </head>
            <body>
              <p>Redirecting to <a href="report.html">latest report</a>…</p>
            </body>
          </html>
          HTML

      # ── 8. Publish report to GitHub Pages ─────────────────────
      - name: Deploy report to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports
          publish_branch: gh-pages
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "report: run #${{ github.run_number }}"

      # ── 9. Send Gmail notification ────────────────────────────
      - name: Send report email
        if: steps.pytest.outcome == 'failure' || steps.pytest.outcome == 'cancelled'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          to: ${{ secrets.MAIL_TO }}
          from: "M&S Automation <${{ secrets.MAIL_USERNAME }}>"
          subject: "M&S E2E Report — Run #${{ github.run_number }} — ${{ job.status }}"
          body: |
            Hi,

            Your scheduled M&S automation run #${{ github.run_number }} has completed.

            Status: ${{ job.status }}

            📊 Live Report:
            https://chauhan-saurabh.github.io/ms-python-automation/report.html

            🔍 Actions Log:
            https://github.com/chauhan-saurabh/ms-python-automation/actions/runs/${{ github.run_id }}

            🕐 Run time: ${{ github.run_started_at }}

            --
            M&S Automation Bot
